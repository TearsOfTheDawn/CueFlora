[project]
name = "cueflora-host"
version = "0.2.1"
description = "Native messaging host for cueflora – downloads YouTube audio via yt-dlp and transcribes via Whisper API"
requires-python = ">=3.10"
dependencies = ["httpx", "PyJWT[crypto]==2.15.1", "cryptography==50.0.2"]

[project.scripts]
cueflora-host = "cueflora_host:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cueflora_host"
module-root = ""
