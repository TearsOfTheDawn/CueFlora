name: Build CueFlora 0.1.13 GitHub candidate
on:
  workflow_dispatch:
  push:
    branches: ['codex/github-build-0.1.13']
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'TearsOfTheDawn/CueFlora'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Require the bounded candidate version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne '0.1.13') { throw 'This candidate workflow is limited to 0.1.13' }
      - name: Install exact hash-locked build dependencies
        run: python -m pip install --require-hashes -r packaging/requirements-windows-hashed.lock
      - name: Fetch exact public sources and tools
        run: python packaging/bootstrap_public_cache.py --cache artifacts/inputs --audio-cache artifacts/audio-inputs --evidence-cache artifacts/evidence --online
      - name: Restore exact standalone build interpreter
        run: python packaging/bootstrap_offline.py --cache artifacts/inputs --output artifacts/build-python --official
      - name: Cache exact npm inputs
        run: node scripts/cache-npm.mjs artifacts/inputs/npm
      - name: Full offline GitHub build and regression verification
        run: artifacts/build-python/venv/Scripts/python.exe packaging/prepare_windows.py --output artifacts/candidate --cache artifacts/inputs --evidence-cache artifacts/evidence --audio-cache artifacts/audio-inputs --public-config packaging/github-identity.json
      - name: Prepare measured candidate review handoff
        run: artifacts/build-python/venv/Scripts/python.exe packaging/github_candidate.py --preparation artifacts/candidate --output artifacts/github-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cueflora-github-candidate
          path: artifacts/github-candidate/
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      # Explicit publisher-directed candidate sharing only. No release, tag,
      # Pages write, approval generation or automatic future-version publication.
