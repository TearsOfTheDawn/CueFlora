name: Clarify existing CueFlora 0.1.13 installation guide once
on:
  push:
    branches: ['codex/install-guide-0.1.13']
    paths: ['release/install-guide-0.1.13.json']
permissions:
  contents: read
concurrency:
  group: cueflora-install-guide-0.1.13
  cancel-in-progress: false
jobs:
  edit-existing-description:
    if: github.repository == 'TearsOfTheDawn/CueFlora' && github.ref == 'refs/heads/codex/install-guide-0.1.13'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Update only the existing title and installation instructions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          proposal=json.loads(Path('release/install-guide-0.1.13.json').read_text())
          assert proposal['schema']==1 and proposal['repository']=='TearsOfTheDawn/CueFlora'
          assert proposal['releaseId']==416055357 and proposal['tag']=='v0.1.13'
          assert proposal['name']=='CueFlora 0.1.13 — Windows & Chrome'
          assert set(proposal)=={'schema','repository','releaseId','tag','name','body','expected'}
          url='https://api.github.com/repos/TearsOfTheDawn/CueFlora/releases/416055357'

          def request(method='GET',data=None):
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
              raw=None if data is None else json.dumps(data).encode()
              req=urllib.request.Request(url,data=raw,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=30) as reply:
                  return json.load(reply)

          def snapshot(release):
              result={key:release[key] for key in ('id','tag_name','target_commitish','draft','prerelease')}
              result['assets']=sorted([{key:asset[key] for key in ('id','name','size','digest')}
                  for asset in release['assets']],key=lambda row:row['name'])
              return result

          expected=proposal['expected']
          expected['assets'].sort(key=lambda row:row['name'])
          assert expected['id']==416055357 and expected['tag_name']=='v0.1.13'
          assert expected['draft'] is False and expected['prerelease'] is False
          assert len(expected['assets'])==9
          assert all(row['digest'].startswith('sha256:') for row in expected['assets'])
          before=request()
          assert snapshot(before)==expected, 'Release identity/assets changed; no edits made'
          assert 'includes everything you need' in proposal['body']
          assert proposal['body'].count('releases/download/v0.1.13/CueFlora-0.1.13-Windows-x64.zip')==1
          request('PATCH',{'name':proposal['name'],'body':proposal['body']})
          after=request()
          assert snapshot(after)==expected, 'Release assets or identity unexpectedly changed'
          assert after['name']==proposal['name'] and after['body']==proposal['body']
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/presentation-receipt.json').write_text(json.dumps({
              'releaseId':416055357,'tag':'v0.1.13','name':after['name'],
              'onlyTitleAndBodyChanged':True,'assetsUnchanged':expected['assets'],
              'binariesRebuilt':False,'newReleaseCreated':False},indent=2)+'\n')
          print('Updated existing 0.1.13 title/instructions; all nine assets, tag and release state unchanged.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cueflora-0.1.13-install-guide-receipt
          path: artifacts/presentation-receipt.json
          if-no-files-found: error
          retention-days: 14
      # No release/tag creation, uploads, deletion, future-version publication,
      # binary rebuild, installation or credential discovery.
