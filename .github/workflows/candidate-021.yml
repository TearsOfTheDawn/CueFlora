name: Build CueFlora 0.2.1 candidate only
on:
  push:
    branches: ['codex/github-build-0.2.1']
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'TearsOfTheDawn/CueFlora' && github.ref == 'refs/heads/codex/github-build-0.2.1'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Restore exact committed source bytes
        shell: pwsh
        run: |
          $candidateArchive = Join-Path $env:RUNNER_TEMP 'cueflora-021-source.tar'
          git archive --format=tar --output=$candidateArchive HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          tar -xf $candidateArchive
          if ($LASTEXITCODE -ne 0) { throw 'Source restore failed' }
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne '0.2.1') { throw 'This job is bounded to 0.2.1' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: python -m pip install --require-hashes -r packaging/requirements-windows-hashed.lock
      - run: python packaging/bootstrap_public_cache.py --cache artifacts/inputs --audio-cache artifacts/audio-inputs --evidence-cache artifacts/evidence --online
      - run: python packaging/bootstrap_offline.py --cache artifacts/inputs --output artifacts/build-python --official
      - run: node scripts/cache-npm.mjs artifacts/inputs/npm
      - run: npm ci --offline --cache artifacts/inputs/npm --no-audit --no-fund
      - name: Prepare and verify only; never publish
        run: artifacts/build-python/venv/Scripts/python.exe packaging/prepare_windows.py --output artifacts/candidate-021 --cache artifacts/inputs --evidence-cache artifacts/evidence --audio-cache artifacts/audio-inputs --public-config packaging/github-identity.json
      - name: Export exact measured candidate for separate review
        run: artifacts/build-python/venv/Scripts/python.exe packaging/github_candidate.py --preparation artifacts/candidate-021 --output artifacts/github-candidate-021
      - name: Bounded diagnostic context on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path artifacts/candidate-021) {
            Get-ChildItem artifacts/candidate-021 -File -Filter *.log | Sort-Object LastWriteTime -Descending | Select-Object -First 3 | ForEach-Object { Write-Output $_.Name; Get-Content -LiteralPath $_.FullName -Tail 80 }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cueflora-021-reviewed-inputs
          path: artifacts/github-candidate-021/
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      # No write permission, release/tag/Pages action, installation or inference.
