name: Inspect CueFlora 0.2.2 candidate once
on:
  push:
    branches: ['codex/github-review-0.2.2']
    paths: ['release/inspect-022.py']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'TearsOfTheDawn/CueFlora' && github.ref == 'refs/heads/codex/github-review-0.2.2'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Wait for only this exact candidate build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/TearsOfTheDawn/CueFlora/actions/runs/39813901477'
          for _ in range(90):
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:run=json.load(response)
              assert run['head_sha']=='2089edaa8d92e416e8daa3dccc61bdf55bacf7a5'
              if run['status']=='completed':
                  assert run['conclusion']=='success','Candidate build did not pass'
                  break
              time.sleep(30)
          else:raise RuntimeError('Candidate wait expired')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2089edaa8d92e416e8daa3dccc61bdf55bacf7a5
          path: release-source
          persist-credentials: false
      - name: Install only hash-pinned inspection HTTP dependencies
        run: |
          python - <<'PY'
          import os,subprocess,sys
          from pathlib import Path
          names={'anyio','certifi','h11','httpcore','httpx','idna','typing_extensions'}
          lines=Path('release-source/packaging/requirements-windows-hashed.lock').read_text().splitlines()
          selected=[line for line in lines if line.split('==',1)[0].lower() in names]
          assert len(selected)==len(names) and all('--hash=sha256:' in line for line in selected)
          path=Path(os.environ['RUNNER_TEMP'])/'cueflora-022-inspection-http.lock'
          path.write_text('\n'.join(selected)+'\n')
          subprocess.run([sys.executable,'-m','pip','install','--disable-pip-version-check','--require-hashes','--no-deps','--only-binary=:all:','-r',str(path)],check=True)
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cueflora-022-reviewed-inputs
          run-id: 39813901477
          github-token: ${{ github.token }}
          path: reviewed-candidate
      - name: Independently verify complete candidate and certificate payloads
        run: python release/inspect-022.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cueflora-022-review-metadata
          path: metadata/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      # Read-only exact-version inspection; no executable launch or publication.
