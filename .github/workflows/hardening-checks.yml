name: Hardening and setup checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - name: Full dependency advisory check (including build/test dependencies)
        run: npm audit --include=dev --audit-level=low
        timeout-minutes: 3
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/release-config.test.mjs
      - run: npm run build:chrome
      - run: npm run build:firefox
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Use physical macOS temporary directory for guarded fixtures
        if: runner.os == 'macOS'
        shell: bash
        run: python -c "import os; from pathlib import Path; print('TMPDIR='+str(Path(os.environ.get('TMPDIR','/tmp')).resolve()))" >> "$GITHUB_ENV"
      - name: Native unit-test and frozen-inventory inspection dependencies (not a release build)
        run: python -m pip install httpx==0.28.1 pyinstaller==6.22.0 pyinstaller-hooks-contrib==2026.7 pefile==2024.8.26 PyJWT==2.15.1 cryptography==50.0.2 cffi==2.1.1 pycparser==3.11
      - run: python packaging/run_native_tests.py
      - run: python -m compileall -q native/cueflora_host native/cueflora_setup packaging
      - run: python -m unittest discover -s packaging -p 'test_*.py'
      - run: git diff --check
