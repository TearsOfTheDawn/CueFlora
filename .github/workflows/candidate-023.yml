name: Build exact CueFlora 0.2.3 release candidate only
on:
  push:
    branches: ['codex/github-build-0.2.3']
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'TearsOfTheDawn/CueFlora' && github.ref == 'refs/heads/codex/github-build-0.2.3'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        working-directory: release-source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1efb73091ccac6dd70cc6f43626d9ec5bcfd6c53
          path: release-source
          persist-credentials: false
      - name: Restore exact audited source bytes
        shell: pwsh
        run: |
          $candidateArchive = Join-Path $env:RUNNER_TEMP 'cueflora-023-source.tar'
          git archive --format=tar --output=$candidateArchive HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          tar -xf $candidateArchive
          if ($LASTEXITCODE -ne 0) { throw 'Source restore failed' }
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne '0.2.3') { throw 'This job is bounded to 0.2.3' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: python -m pip install --require-hashes -r packaging/requirements-windows-hashed.lock
      - run: python packaging/bootstrap_public_cache.py --cache artifacts/inputs --audio-cache artifacts/audio-inputs --evidence-cache artifacts/evidence --online
      - run: python packaging/bootstrap_offline.py --cache artifacts/inputs --output artifacts/build-python --official
      - run: node scripts/cache-npm.mjs artifacts/inputs/npm
      - run: npm ci --offline --cache artifacts/inputs/npm --no-audit --no-fund
      - name: Build and verify the exact candidate; never publish
        run: artifacts/build-python/venv/Scripts/python.exe packaging/prepare_windows.py --output artifacts/candidate-023 --cache artifacts/inputs --evidence-cache artifacts/evidence --audio-cache artifacts/audio-inputs --public-config packaging/github-identity.json
      - name: Confirm source identity and export measured review inputs
        run: |
          $env:GITHUB_SHA='1efb73091ccac6dd70cc6f43626d9ec5bcfd6c53'
          python -c "import json; r=json.load(open('artifacts/candidate-023/readiness.json')); assert r['sourceInventorySha256']=='07ac77909c97b8457863554addaccd273721b2c75eb15a2671fd920f33116a83'; assert r['sourceArchive']['archiveSha256']=='2a77a46f2564c61c29535a090ea42067098df33c45bca4b7bb1dd9971dc91281'"
          artifacts/build-python/venv/Scripts/python.exe packaging/github_candidate.py --preparation artifacts/candidate-023 --output artifacts/github-candidate-023
      - name: Bounded diagnostic context on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path artifacts/candidate-023) {
            Get-ChildItem artifacts/candidate-023 -File -Filter *.log | Sort-Object LastWriteTime -Descending | Select-Object -First 3 | ForEach-Object { Write-Output $_.Name; Get-Content -LiteralPath $_.FullName -Tail 80 }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cueflora-023-reviewed-inputs
          path: release-source/artifacts/github-candidate-023/
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      # Read-only exact-version job. No release, Pages, installation or inference.
