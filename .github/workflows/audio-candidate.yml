name: Pinned Windows audio/runtime candidate (no public binaries)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - run: python packaging/bootstrap_public_cache.py --cache artifacts/inputs --audio-cache artifacts/audio-inputs --evidence-cache artifacts/evidence --online
      - run: python packaging/bootstrap_offline.py --cache artifacts/inputs --output artifacts/build-python --official
      - run: node scripts/cache-npm.mjs artifacts/inputs/npm
      - run: python packaging/audio_build.py --cache artifacts/audio-inputs --output artifacts/compiler --bootstrap
      - run: artifacts/build-python/venv/Scripts/python.exe packaging/audio_build.py --cache artifacts/audio-inputs --toolchain artifacts/compiler/msys64 --output artifacts/audio-build --jobs 4
      - run: artifacts/build-python/venv/Scripts/python.exe packaging/verify_audio_conformance.py --candidate artifacts/audio-build --output artifacts/audio-verification
      # The previous adoption comparison is retained. Fresh builds verify the
      # approved recipe and public synthetic fixtures, not private old binaries.
      - run: artifacts/build-python/venv/Scripts/python.exe -m unittest discover -s packaging -p 'test_*.py'
      - run: artifacts/build-python/venv/Scripts/python.exe packaging/source_export.py --output artifacts/source-export
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-build-evidence-no-executables
          path: |
            artifacts/audio-build/audio-build.json
            artifacts/audio-verification/audio-conformance.json
            artifacts/source-export/source-audit.json
          retention-days: 7
      # No binaries, dependency archives, tags, installation or publication.
